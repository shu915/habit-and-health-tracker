services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: habit_health
    ports:
      # 他プロジェクトの Postgres が 5432 を使うことがあるため 5433 にする(ローカル専用)
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d habit_health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
